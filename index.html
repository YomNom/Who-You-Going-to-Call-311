<!DOCTYPE html>
<html>

<head>
    <title>Cincinnati 311 Pothole Requests - Interactive Map</title>
    <link rel="icon" href="data:;base64,iVBORwOKGO=" />
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header id="site-header">
        <div id="header-left">
            <h1>Who You Going to Call? 3-1-1</h1>
            <p id="header-subtitle">Cincinnati Pothole Requests &middot; 2022</p>
        </div>
        <div id="kpi-strip">
            <div class="kpi-card">
                <span class="kpi-value" id="kpi-total">—</span>
                <span class="kpi-label">Total Requests</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-value" id="kpi-avg-response">—</span>
                <span class="kpi-label">Avg Response Days</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-value" id="kpi-neighborhoods">—</span>
                <span class="kpi-label">Neighborhoods</span>
            </div>
        </div>
        <div id="header-controls">
            <label>Color by:
                <select id="color-select">
                    <option value="priority">Priority</option>
                    <option value="response_time">Response Time</option>
                    <option value="neighborhood">Neighborhood</option>
                    <option value="agency">Agency</option>
                </select>
            </label>
            <label>Basemap:
                <select id="basemap-select">
                    <option value="Esri Topo">Esri Topo</option>
                    <option value="Esri Imagery">Esri Imagery</option>
                    <option value="OpenStreetMap">OpenStreetMap</option>
                    <option value="CartoDB Positron">CartoDB Positron</option>
                    <option value="CartoDB Dark">CartoDB Dark</option>
                    <option value="Esri Streets">Esri Streets</option>
                </select>
            </label>
            <button id="toggle-heatmap">Show Heatmap</button>
            <button id="brush-toggle">Brush Select</button>
            <button id="reset-all">Reset All</button>
            <span id="unmapped-info" class="info-text"></span>
        </div>
    </header>

    <div id="maps-row">
        <div class="card" id="point-map-card">
            <div class="card-label">Find potholes near you</div>
            <div id="my-map"></div>
        </div>
        <div class="card" id="choropleth-card">
            <div class="card-label">Hottest neighborhoods</div>
            <div id="choropleth-map"></div>
        </div>
    </div>

    <div class="card" id="timeline-panel">
        <div class="card-label">2022 in review &mdash; brush to filter by date</div>
        <div id="timeline-chart"></div>
    </div>

    <div id="bottom-row">
        <div class="card">
            <div class="card-label">How were they reported?</div>
            <div id="lollipop-chart"></div>
        </div>
        <div class="card">
            <div class="card-label">How urgent?</div>
            <div id="barchart-priority"></div>
        </div>
        <div class="card">
            <div class="card-label">Which department?</div>
            <div id="donut-chart"></div>
        </div>
        <div class="card">
            <div class="card-label">What are people throwing away?</div>
            <div id="word-cloud-chart"></div>
        </div>
    </div>

    <div id="tooltip"></div>

    <!-- Dependencies first -->
    <script src="js/d3.v6.min.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/leaflet-heat.js"></script>
    <script src="js/d3.layout.cloud.js"></script>

    <!-- Chart classes -->
    <script src="js/wordCloud.js"></script>
    <script src="js/leafletMap.js"></script>
    <script src="js/choroplethMap.js"></script>
    <script src="js/potholeMap.js"></script>
    <script src="js/donutChart.js"></script>
    <script src="js/barchartPriority.js"></script>
    <script src="js/lollipopChart.js"></script>
    <script src="js/timelineChart.js"></script>

    <!-- Orchestrator last -->
    <script src="js/main.js"></script>
</body>

</html>
