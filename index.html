<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cincinnati 311 Pothole Requests - Interactive Map</title>
    <link rel="icon" href="data:;base64,iVBORwOKGO=" />
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="title-bar">
        <h1>Who are you going to call? 3-1-1!</h1>
        <!--
            <div id="choose-data">
                <label>Selected data:
                    <select id="data-select">
                        <option value="PTHOLE">Pothole(s)</option>
                        <option value="LITR-PRV">Littering</option>
                        <option value="TREEPR">Dead Tree(s) on Private Property</option>
                        <option value="DAPUB1">Dead Animal(s)</option>
                        <option value="DUMP-PVS">Dumping(s)</option>
                    </select>
                </label>
            </div>
        -->
        <div id="choose-data">
            <p><strong>Selected data:</strong></p>
            <div class="data-options">
                <label>
                    <input type="checkbox" name="data-select" value="PTHOLE"> Pothole(s)
                </label>
                <label>
                    <input type="checkbox" name="data-select" value="LITR-PRV"> Littering
                </label>
                <label>
                    <input type="checkbox" name="data-select" value="TREEPR"> Dead Tree(s) on Private Property
                </label>
                <label>
                    <input type="checkbox" name="data-select" value="DAPUB1"> Dead Animal(s)
                </label>
                <label>
                    <input type="checkbox" name="data-select" value="DUMP-PVS"> Dumping(s)
                </label>
            </div>
            <div class="data-actions">
                <button id="select-all-data" type="button">Select All</button>
                <button id="clear-data-selection" type="button">Clear Selection</button>
            </div>
        </div>
    </div>
    <!-- Main two-column layout: Map left, Attributes right -->
    <div id="dashboard">

        <!-- LEFT: Map panel -->
        <div id="map-panel">
            <div id="map-controls">
                <label>Color by:
                    <select id="color-select">
                        <option value="priority">Priority</option>
                        <option value="response_time">Response Time</option>
                        <option value="neighborhood">Neighborhood</option>
                        <option value="agency">Agency</option>
                    </select>
                </label>
                <button id="toggle-basemap">Toggle Basemap</button>
                <span id="unmapped-info" class="info-text"></span>
            </div>
            <div id="my-map"></div>
        </div>

        <!-- RIGHT: Attribute charts -->
        <div id="attrs-panel">
            <div id="lollipop-chart"></div>
            <div id="barchart-priority"></div>
            <!-- Two donuts side by side -->
            <div id="donut-row">
                <div id="donut-chart"></div>
                <div id="neighborhood-chart"></div>
            </div>
        </div>

    </div>

    <!-- BOTTOM: Timeline spanning full width -->
    <div id="timeline-panel">
        <div id="timeline-chart"></div>
    </div>

    <!--

    <div id="map-container">
        <div id="my-map"></div>
        <div id="legend"></div>
    </div>

    <div id="choropleth-map"></div>

    <div id="charts-row">
        <div id="lollipop-chart"></div>
        <div id="barchart-priority"></div>
        <div id="donut-chart"></div>
    </div>

    <!-- Dependencies first -->
    <script src="js/d3.v6.min.js"></script>
    <script src="js/leaflet.js"></script>

    <!-- Chart classes -->
    <script src="js/leafletMap.js"></script>
    <script src="js/potholeMap.js"></script>
    <script src="js/donutChart.js"></script>
    <script src="js/barchartPriority.js"></script>
    <script src="js/lollipopChart.js"></script>
    <script src="js/timelineChart.js"></script>

    <!-- Orchestrator last -->
    <script src="js/main.js"></script>
</body>
</html>
